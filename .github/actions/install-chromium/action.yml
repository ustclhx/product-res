name: Install Chromium
description: Restore the cached Playwright Chromium headless shell and install its system dependencies with apt timeouts
runs:
  using: composite
  # 从 prepare-local-tests 提取；CI 的 test-web 与本地冒烟/夜间验收共用。默认 headless 启动使用 headless shell。
  steps:
    - name: Get Playwright version
      id: playwright
      working-directory: apps/web
      shell: bash
      run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-shell
    # apt 镜像偶发卡死（曾整步挂满 5 分钟）：给 apt 单次请求加超时，并对整次安装限时重试。
    # runner 启动时的 apt-daily 常占着 dpkg 锁，apt 默认立即失败；改为最多等待 90 秒。
    - name: Configure apt timeouts
      shell: bash
      run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "90";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
    # 新 runner 上 apt-daily / unattended-upgrades 曾持有 dpkg 前端锁超过 7 分钟，90 秒锁等待与 3 次重试全部失败
    # （run 44368773262 的 compose job）。安装前先停止并屏蔽这些后台任务，再有界等待锁释放。
    - name: Wait for apt locks
      shell: bash
      run: |
        for unit in apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service unattended-upgrades.service; do
          # 停止正在升级的 unattended-upgrades 可能阻塞，单个单元限时；单元不存在时忽略
          sudo timeout -k 5 60 systemctl stop "$unit" 2>/dev/null || true
          sudo systemctl mask "$unit" >/dev/null 2>&1 || true
        done
        if ! command -v fuser >/dev/null 2>&1; then
          echo "::warning::未找到 fuser，跳过 apt 锁等待（仍依赖 DPkg::Lock::Timeout 与重试）"
          exit 0
        fi
        locks=(/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock)
        deadline=$((SECONDS + 300))
        while sudo fuser "${locks[@]}" >/dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            echo "::warning::apt/dpkg 锁 5 分钟后仍被占用，继续安装（仍依赖 DPkg::Lock::Timeout 与重试）"
            sudo fuser -v "${locks[@]}" || true
            exit 0
          fi
          sleep 5
        done
        echo "apt/dpkg 锁已空闲（本步骤用时 ${SECONDS} 秒）"
    - name: Install Chromium
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: timeout -k 10 600 pnpm --filter @product-res/web exec playwright install --with-deps --only-shell chromium
    - name: Install Chromium system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if timeout -k 10 220 pnpm --filter @product-res/web exec playwright install-deps chromium; then exit 0; fi
          echo "::warning::playwright install-deps 第 ${attempt} 次失败或超时，重试"
          # 被中断的 dpkg 会留下半配置状态，下一次安装前先修复。
          sudo dpkg --configure -a || true
          sleep 5
        done
        exit 1
