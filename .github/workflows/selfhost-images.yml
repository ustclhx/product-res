name: Selfhost images

on:
  pull_request:
    # 纯文档/规格/证据改动不影响镜像内容，跳过约 15 分钟的双架构构建；发布经 workflow_call 不受影响。
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
  push:
    branches: [main]
    # 纯文档/规格/证据改动不影响镜像内容，跳过约 15 分钟的双架构构建；发布经 workflow_call 不受影响。
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
  workflow_call:
    inputs:
      sha:
        description: Full source commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v4
      - name: Resolve actual checked-out revision
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Test publication policy boundaries
        run: node --test deploy/selfhost/images/policy.test.mjs
      - name: Verify pinned multiarch bases
        run: node deploy/selfhost/images/check-bases.mjs
      - name: Build and export native images
        run: node deploy/selfhost/images/build.mjs '${{ steps.source.outputs.sha }}' '${{ matrix.arch }}' image-artifacts
      - name: Smoke images and real runtime readiness
        run: node deploy/selfhost/images/smoke.mjs '${{ steps.source.outputs.sha }}' '${{ matrix.arch }}' image-artifacts
      # 只有整组 smoke 通过才供发布 workflow 使用，不上传临时运行文件或容器日志。
      - uses: actions/upload-artifact@v6
        with:
          name: selfhost-images-${{ steps.source.outputs.sha }}-${{ matrix.arch }}
          path: image-artifacts/
          if-no-files-found: error
          retention-days: 3
