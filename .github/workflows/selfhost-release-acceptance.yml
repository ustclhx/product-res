name: Selfhost released bundle acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/selfhost-release-acceptance.yml'
      - 'deploy/selfhost/test-release-compose.py'
  workflow_dispatch:

# 只读取已成功发布的artifact和匿名registry，不发布镜像、不接入服务器。
permissions:
  contents: read
  actions: read

concurrency:
  group: selfhost-release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  released-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_SHA: 081305013b022f457c561eecf5828b1959e13908
      RELEASE_RUN: '38588820873'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the successful release and build its immutable source-SHA bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/released-bundle/images"
          gh run view "$RELEASE_RUN" --repo ustclhx/product-res --json conclusion,headSha > "$RUNNER_TEMP/released-bundle/run.json"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/released-bundle/run.json")); assert r["conclusion"]=="success" and r["headSha"]==os.environ["RELEASE_SHA"]'
          gh run download "$RELEASE_RUN" --repo ustclhx/product-res -n "selfhost-image-set-$RELEASE_SHA" -D "$RUNNER_TEMP/released-bundle/images"
          python3 -c 'import json,os; s=json.load(open(os.environ["RUNNER_TEMP"]+"/released-bundle/images/image-set.json")); assert s["namespace"]=="ghcr.io/ustclhx/product-res"'
          python3 deploy/selfhost/release/bundle.py build --source . --sha "$RELEASE_SHA" --image-set "$RUNNER_TEMP/released-bundle/images/image-set.json" --output "$RUNNER_TEMP/released-bundle/bundle"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'released-bundle/bundle'
          release = json.loads((root / 'release.json').read_text())
          recovery = {'restore.sh', 'restore-drill.sh', 'backup/restore.py', 'compose.replica.yaml',
                      '.env.backup.example', '.env.object-storage.example', '.env.replica.example'}
          assert recovery <= release['files'].keys() and len(release['files']) == 27
          PY
          python3 "$RUNNER_TEMP/released-bundle/bundle/release/bundle.py" compose-config "$RUNNER_TEMP/released-bundle/bundle" --sha "$RELEASE_SHA"
      - name: Pull all immutable prebuilt images anonymously
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          printf '{}' > "$RUNNER_TEMP/anonymous-docker/config.json"
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          python3 - <<'PY'
          import json, os, subprocess
          path = os.environ['RUNNER_TEMP'] + '/released-bundle/images/image-set.json'
          for image in json.load(open(path))['images']:
              subprocess.run(['docker', 'pull', image['reference']], check=True, timeout=900)
          PY
      - name: Exercise the real bundle, upgrade and compatible rollback in empty volumes
        run: |
          trap 'sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/released-bundle"' EXIT
          sudo env PATH="$PATH" python3 deploy/selfhost/test-release-compose.py --bundle "$RUNNER_TEMP/released-bundle/bundle" --evidence "$RUNNER_TEMP/released-bundle/compose-evidence.json"
          python3 deploy/selfhost/test-deploy-compose.py > "$RUNNER_TEMP/released-bundle/failure-gates.jsonl"
      - name: Preserve hidden examples and executable modes in the acceptance bundle
        run: tar -C "$RUNNER_TEMP/released-bundle/bundle" -czf "$RUNNER_TEMP/released-bundle/selfhost-release-$RELEASE_SHA.tar.gz" .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selfhost-released-bundle-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/released-bundle/*.tar.gz
            ${{ runner.temp }}/released-bundle/*.json
            ${{ runner.temp }}/released-bundle/*.jsonl
            ${{ runner.temp }}/released-bundle/images/image-set.json
          if-no-files-found: error
