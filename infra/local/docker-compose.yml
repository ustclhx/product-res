# 本地开发 Postgres。约定（scripts/orca/lib.sh 与 docs/09-parallel-plan.md §2 依赖它们）：
#   - 容器名 product-res-pg，超级用户 postgres，宿主机端口 5432
#   - 主 checkout 使用数据库 product_res_dev；Orca worktree 由 scripts/orca/setup.sh 另建 product_res_wt_<名称>
#   - 初始化脚本创建 app（DML）/ migrator（DDL）/ readonly（SELECT）三个账号，本地密码与账号名相同
# 启动：docker compose -f infra/local/docker-compose.yml up -d
# 初始化脚本只在数据卷为空时执行；修改后需 down -v 重建。
# 健康检查走 TCP：初始化期间的临时实例只监听 unix socket，避免过早报告就绪。
# TLS：pg-tls-entrypoint.sh 首次启动时生成自签证书并开启 ssl（Workers VPC 要求，docs/07 §2）。
# Tunnel（可选，阶段一 staging 用）：在 infra/local/.env 写入 CLOUDFLARE_TUNNEL_TOKEN 后
#   docker compose -f infra/local/docker-compose.yml --profile tunnel up -d
#   两个 cloudflared 副本连接同一 Tunnel，经 compose 内网以主机名 postgres 访问数据库。
name: product-res

services:
  postgres:
    image: postgres:17
    container_name: product-res-pg
    restart: unless-stopped
    entrypoint: ['/usr/local/bin/pg-tls-entrypoint.sh']
    command: ['postgres']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_res_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./pg-tls-entrypoint.sh:/usr/local/bin/pg-tls-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d product_res_dev']
      interval: 2s
      timeout: 3s
      retries: 30

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ['tunnel']
    restart: unless-stopped
    # 使用 HTTP/2（TCP）而不是默认的 QUIC（UDP）连接 Cloudflare 边缘：本机若有 TUN / fake-ip 模式的代理
    # （Clash、Surge 等），QUIC 常被阻断，表现为 "failed to dial to edge with quic"，Hyperdrive 随之报数据库不可达。
    command: ['tunnel', '--no-autoupdate', '--protocol', 'http2', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # 在 infra/local/.env 中设置；为空时 cloudflared 启动失败
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
