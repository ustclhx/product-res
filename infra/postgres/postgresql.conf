# 生产服务器 Postgres 配置（阶段二模板）。按服务器内存调整「资源」一节。
listen_addresses = '*'          # 只在 compose 内网可达，不映射宿主机端口
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 100           # Hyperdrive 维护连接池，应用侧连接数不高

# TLS（Workers VPC 要求；pg-entrypoint.sh 把证书复制到此处并设置权限）
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# 资源（以 4 GB 内存为例）
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# WAL 与归档：阶段二接入 WAL-G 时改为 archive_mode = on 并设置 archive_command
wal_level = replica
archive_mode = off
archive_timeout = 60s           # 开启归档后 RPO ≤ 1 分钟（docs/07 §1「可用性目标」）

# 可观测性
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500ms
log_connections = on
log_disconnections = on
timezone = 'UTC'
log_timezone = 'UTC'
