name: product-res-pilot

services:
  api:
    image: ${PRODUCT_RES_APP_IMAGE:-product-res-pilot:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      PRODUCT_RES_MODE: pilot
      PRODUCT_RES_DATA_DIR: /data
      PRODUCT_RES_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to a loopback HTTP or HTTPS origin}
      PRODUCT_RES_PROVIDERS_FILE: /etc/product-res/providers.json
    volumes:
      - pilot_data:/data
      - ./secrets:/run/secrets:ro
      - ./deploy/providers.json:/etc/product-res/providers.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${PRODUCT_RES_APP_IMAGE:-product-res-pilot:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["python", "-m", "app.pilot.worker"]
    environment:
      PRODUCT_RES_MODE: pilot
      PRODUCT_RES_DATA_DIR: /data
      PRODUCT_RES_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to a loopback HTTP or HTTPS origin}
      PRODUCT_RES_PROVIDERS_FILE: /etc/product-res/providers.json
    volumes:
      - pilot_data:/data
      - ./secrets:/run/secrets:ro
      - ./deploy/providers.json:/etc/product-res/providers.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 0.50
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  gateway:
    image: ${PRODUCT_RES_GATEWAY_IMAGE:-product-res-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=8m
      - /var/run:rw,noexec,nosuid,size=1m
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  pilot_data:
    name: product-res-pilot-data
