# 仅显式加载启用；备份身份/只读PGDATA与peer socket不分配给web/jobs。
x-backup-env: &backup-env
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set the independent backup S3 HTTPS endpoint}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
  BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:?Use a unique s3://bucket/cluster/pg17 prefix}
  BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
  BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key_id
  BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_access_key
  BACKUP_S3_CA_FILE: /run/certs/backup-ca.crt
  BACKUP_STATE_DIR: /var/lib/selfhost-backup
  BACKUP_TMP_DIR: /var/lib/selfhost-backup/tmp
  POSTGRES_DB: ${POSTGRES_DB:-product_res_production}
  BACKUP_DISK_RATE_LIMIT: ${BACKUP_DISK_RATE_LIMIT:-10485760}
  BACKUP_NETWORK_RATE_LIMIT: ${BACKUP_NETWORK_RATE_LIMIT:-10485760}

services:
  postgres:
    environment:
      <<: *backup-env
      BACKUP_ENABLED: 'true'
      BACKUP_ARCHIVE_TIMEOUT_SECONDS: ${BACKUP_ARCHIVE_TIMEOUT_SECONDS:-60}
    secrets: [backup_s3_access_key_id, backup_s3_secret_access_key]
    volumes:
      - postgres_socket:/var/run/postgresql
      - backup_state:/var/lib/selfhost-backup
      - '${BACKUP_CA_FILE:-./certs/backup-ca.crt}:/run/certs/backup-ca.crt:ro'

  backup:
    image: ${BACKUP_IMAGE:?Use the matching full SHA prebuilt backup image}
    user: '999:999'
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.2
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    environment:
      <<: *backup-env
      PGDATA: /var/lib/postgresql/data
      BACKUP_UTC_TIME: ${BACKUP_UTC_TIME:-02:00}
      BACKUP_DAILY_DAYS: ${BACKUP_DAILY_DAYS:-7}
      BACKUP_WEEKLY_WEEKS: ${BACKUP_WEEKLY_WEEKS:-4}
      BACKUP_WEEKLY_DAY: ${BACKUP_WEEKLY_DAY:-0}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-134217728}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
    secrets: [backup_s3_access_key_id, backup_s3_secret_access_key]
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - postgres_socket:/var/run/postgresql:ro
      - backup_state:/var/lib/selfhost-backup
      - '${BACKUP_CA_FILE:-./certs/backup-ca.crt}:/run/certs/backup-ca.crt:ro'
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # 必须有最近成功base/dump和经完整性校验的归档链，不以scheduler进程存活判定。
      test: [CMD, python3, /usr/local/lib/selfhost-backup/backup.py, health]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10m

volumes:
  postgres_socket: {}
  backup_state: {}

secrets:
  backup_s3_access_key_id: {file: '${SECRETS_DIR:-./secrets}/backup_s3_access_key_id'}
  backup_s3_secret_access_key: {file: '${SECRETS_DIR:-./secrets}/backup_s3_secret_access_key'}
