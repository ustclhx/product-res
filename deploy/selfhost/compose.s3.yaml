# 外部 S3（含 R2）与基础 compose.yaml 一起加载；不启动自带存储或 bucket 初始化器。
x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:?Set a browser-reachable S3 HTTPS endpoint}
  S3_REGION: ${S3_REGION:?Set the S3 region explicitly (R2 uses auto)}
  S3_BUCKET: ${S3_BUCKET:?Set the private application bucket}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
  S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key

services:
  web:
    environment: *s3-env
    secrets: [s3_access_key_id, s3_secret_access_key]
  jobs:
    environment: *s3-env
    secrets: [s3_access_key_id, s3_secret_access_key]

secrets:
  s3_access_key_id: {file: '${SECRETS_DIR:-./secrets}/s3_access_key_id'}
  s3_secret_access_key: {file: '${SECRETS_DIR:-./secrets}/s3_secret_access_key'}
